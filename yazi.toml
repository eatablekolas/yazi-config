[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = true
sort_dir_first = true
linemode = "mtime"
show_hidden = true

[opener]
edit = [
  { run = 'nvim "%s"', block = true },
]
explorer = [
  { run = 'explorer "%s"', orphan = true },
]

[open]
prepend_rules = [
  { url = "*/", use = "explorer" },
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "inode/empty", use = "edit" }
]

